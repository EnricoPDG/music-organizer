name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

      - name: Rust format and lint
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo lint

      - name: Rust tests (offline, fixtures only)
        working-directory: src-tauri
        run: cargo test

      - name: Generated TypeScript bindings are up to date
        run: |
          pnpm bindings
          git diff --exit-code src/lib/bindings.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e

      - name: Debug app build
        run: pnpm tauri build --debug --no-bundle
