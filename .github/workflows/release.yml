name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            artifact: music-organizer.app
            archive: music-organizer-macos.zip
          - os: windows-latest
            platform: windows
            artifact: music-organizer.exe
            archive: music-organizer-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # macOS: install webkit dependency
      - name: Install macOS deps
        if: matrix.platform == 'darwin'
        run: brew install pkg-config

      # Windows: install webkit2gtk (not needed on Windows, skip)
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        run: wails build -ldflags "-X main.Version=${{ github.ref_name }}"

      # macOS: zip the .app bundle
      - name: Package (macOS)
        if: matrix.platform == 'darwin'
        run: cd build/bin && zip -r ../../${{ matrix.archive }} ${{ matrix.artifact }}

      # Windows: zip the .exe
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/${{ matrix.artifact }} -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Music Organizer ${{ github.ref_name }}
          body: |
            ## Music Organizer ${{ github.ref_name }}

            Download the binary for your platform below.

            ### Installation
            - **macOS**: Unzip and move `music-organizer.app` to your Applications folder
            - **Windows**: Unzip and run `music-organizer.exe`

            ---
            Built with Go + Wails v2 · [Source](https://github.com/EnricoPDG/music-organizer)
          files: artifacts/**/*
