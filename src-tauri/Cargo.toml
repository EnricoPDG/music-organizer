[package]
name = "music-organizer"
version = "0.1.0"
description = "Organize your music library: import playlists, match to YouTube, download tagged audio"
edition = "2024"
rust-version = "1.85"
license = "MIT"
# All integration tests compile into one binary (tests/main.rs) to save build time and disk.
autotests = false

[lib]
name = "music_organizer_lib"
crate-type = ["rlib"]

[features]
# Opt-in smoke tests against live platforms (never run by default or in CI).
live = []

[[test]]
name = "integration"
path = "tests/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-shell = "2.5"
tauri-plugin-updater = "2.13"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "charset", "form", "query"] }
governor = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
lofty = "0.25"
keyring = "4.2"
trash = "5.2"
notify = "8.2"
walkdir = "2.5"
strsim = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.28", features = ["v7", "serde"] }
url = { version = "2.5", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
regex = "1.13"
unicode-normalization = "0.1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
scraper = "0.27"

[dev-dependencies]
tempfile = "3.27"
wiremock = "0.6"
tokio = { version = "1.53", features = ["full", "test-util"] }

[profile.dev]
# Keep debug builds small: the dev machine is short on disk space.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
